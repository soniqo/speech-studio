name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands. Saves Apple
# Silicon minutes which are 10x cheaper than they used to be but still cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS (Apple Silicon)
    # Tag pushes are handled by the release-macos job below (signed +
    # notarized, gated on the `release` environment). This job covers PRs
    # and main pushes with the ad-hoc bundle, so skip it on tags rather
    # than building the same commit twice.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      # The Swift sidecar's Package.swift uses a path dependency on
      # ../../speech-swift to match local-dev layout. Mirror that on CI by
      # checking the sibling repo out next to this one.
      - name: Check out speech-swift (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: soniqo/speech-swift
          path: speech-swift
          ref: main

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            speech-studio/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('speech-studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 since its 11.3+ release pulled in
          # the built-in `node:sqlite` module.
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      - name: Build Swift sidecar
        working-directory: speech-studio/swift-sidecar
        run: swift build -c release

      - name: Stage sidecar + metallib for Tauri bundler
        # Has to run before any `cargo` invocation: tauri-build verifies
        # externalBin paths in the build script, so even `cargo test --lib`
        # fails if `binaries/soniqo-tts-sidecar-aarch64-apple-darwin` is
        # missing.
        env:
          # Pin the speech-swift release we pull the metallib from. The
          # metallib is precompiled Metal bytecode and rarely changes; bump
          # this when MLX-Swift's metal kernels do.
          SPEECH_SWIFT_RELEASE: v0.0.18
        working-directory: speech-studio
        run: |
          mkdir -p src-tauri/binaries
          # externalBin convention: Tauri appends the target triple to the
          # configured name (`binaries/soniqo-tts-sidecar` → look for
          # `binaries/soniqo-tts-sidecar-aarch64-apple-darwin`).
          cp swift-sidecar/.build/release/soniqo-tts-sidecar \
             src-tauri/binaries/soniqo-tts-sidecar-aarch64-apple-darwin
          # MLX-Swift drops `mlx.metallib` into the build tree as a side
          # effect, but on this CI runner that side effect never fires
          # (Metal toolchain quirks). Pull a known-good metallib from the
          # speech-swift release tarball instead — same artifact Homebrew
          # ships for `speech`.
          curl -sSL --fail \
            "https://github.com/soniqo/speech-swift/releases/download/${SPEECH_SWIFT_RELEASE}/speech-macos-arm64.tar.gz" \
            -o /tmp/speech-release.tar.gz
          tar -xzf /tmp/speech-release.tar.gz -C /tmp mlx.metallib
          cp /tmp/mlx.metallib src-tauri/binaries/mlx.metallib
          ls -la src-tauri/binaries/

      - name: Run Rust unit tests
        working-directory: speech-studio/src-tauri
        run: cargo test --lib

      - name: Run frontend tests
        working-directory: speech-studio
        run: pnpm test

      - name: Type-check
        working-directory: speech-studio
        run: pnpm tsc --noEmit

      - name: Build Tauri bundle (.app + .dmg, unsigned)
        id: build_tauri_bundle_macos
        working-directory: speech-studio
        # No --no-bundle: we want the .app + .dmg. The macOS bundler
        # ad-hoc signs without a Developer ID; users will need to right-
        # click → Open the first time to bypass Gatekeeper.
        run: |
          set -euo pipefail

          cleanup_stale_dmg_mounts() {
            echo "::group::macOS disk image cleanup"
            hdiutil info || true
            while IFS= read -r device; do
              [[ -n "$device" ]] || continue
              echo "Detaching stale Speech Studio disk image: $device"
              hdiutil detach "$device" || hdiutil detach -force "$device" || true
            done < <(hdiutil info | awk '/\/Volumes\/Speech Studio/ { print $1 }' | sort -u)
            rm -f src-tauri/target/release/bundle/dmg/rw.*.dmg || true
            echo "::endgroup::"
          }

          if ! pnpm tauri build; then
            echo "::warning::Tauri macOS bundle failed once; cleaning stale disk images and retrying."
            cleanup_stale_dmg_mounts
            sleep 5
            pnpm tauri build
          fi

      - name: Collect macOS DMG diagnostics
        if: ${{ failure() && steps.build_tauri_bundle_macos.outcome == 'failure' }}
        working-directory: speech-studio
        run: |
          set +e
          echo "::group::macOS version"
          sw_vers
          xcodebuild -version
          echo "::endgroup::"

          echo "::group::disk images"
          hdiutil info
          diskutil list
          pgrep -af 'hdiutil|diskimages' || true
          echo "::endgroup::"

          echo "::group::bundle outputs"
          find src-tauri/target/release/bundle -maxdepth 4 -print
          du -sh src-tauri/target/release/bundle/* 2>/dev/null
          echo "::endgroup::"

      - name: Upload macOS DMG diagnostics
        if: ${{ failure() && steps.build_tauri_bundle_macos.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-dmg-diagnostics
          path: |
            speech-studio/src-tauri/target/release/bundle/dmg/**
            speech-studio/src-tauri/target/release/bundle/macos/*.app/Contents/Info.plist
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-arm64-dmg
          path: speech-studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .app (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-arm64-app
          path: speech-studio/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows / Linux build the cross-platform C++ sidecar (core-sidecar), which
  # links speech-core's LiteRT VoxCPM2 backend + the HF model downloader. Both
  # check out speech-core as a sibling and build it with
  # SPEECH_CORE_WITH_HF_DOWNLOAD=ON, so they depend on speech-core's main
  # carrying sc_voxcpm2_create_from_pretrained (PR #48). Until that merges these
  # jobs fail to compile — expected.
  #
  # NOTE: these produce installers but a runtime colocation of libLiteRt next to
  # the bundled sidecar is still a packaging follow-up (Tauri places resources
  # apart from externalBin) — same class as the macOS metallib handling.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      - name: Check out speech-core (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: soniqo/speech-core
          path: speech-core
          ref: main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Set up Python (for fetch_litert)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JS deps
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      # Puts dumpbin/lib on PATH so fetch_litert.sh can synthesize the
      # libLiteRt.lib import library from the wheel's DLL (the wheel ships only
      # the .dll). Without this the sidecar link fails with LNK1181.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch libLiteRt (ai-edge-litert wheel)
        working-directory: speech-core
        shell: bash
        run: ./scripts/fetch_litert.sh litert

      - name: Install libcurl (vcpkg, static-MD / Schannel)
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows-static-md'

      - name: Build speech-core (LiteRT + HF download)
        working-directory: speech-core
        shell: pwsh
        run: |
          cmake -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSPEECH_CORE_WITH_LITERT=ON `
            -DLITERT_DIR="$PWD/litert" `
            -DSPEECH_CORE_WITH_HF_DOWNLOAD=ON `
            -DSPEECH_CORE_BUILD_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build --config Release --target speech_core_models_litert

      - name: Build core-sidecar
        working-directory: speech-studio
        shell: pwsh
        run: |
          cmake -B core-sidecar/build -A x64 core-sidecar `
            -DSPEECH_CORE_DIR="$env:GITHUB_WORKSPACE/speech-core" `
            -DSPEECH_CORE_BUILD_DIR="$env:GITHUB_WORKSPACE/speech-core/build" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build core-sidecar/build --config Release

      - name: Run sidecar unit tests
        working-directory: speech-studio
        run: ctest --test-dir core-sidecar/build -C Release --output-on-failure

      - name: Stage sidecar for Tauri bundler
        working-directory: speech-studio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item core-sidecar/build/Release/speech-core-tts-sidecar.exe `
            src-tauri/binaries/speech-core-tts-sidecar-x86_64-pc-windows-msvc.exe
          Copy-Item core-sidecar/build/Release/libLiteRt.dll src-tauri/binaries/libLiteRt.dll

      - name: Build Tauri bundle (.msi + NSIS .exe)
        working-directory: speech-studio
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-windows-x86_64
          path: |
            speech-studio/src-tauri/target/release/bundle/msi/*.msi
            speech-studio/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            speech-studio/src-tauri/target/release/bundle/msi/*.msi
            speech-studio/src-tauri/target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: false

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      - name: Check out speech-core (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: soniqo/speech-core
          path: speech-core
          ref: main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Set up Python (for fetch_litert)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Tauri + libcurl + cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libcurl4-openssl-dev \
            build-essential cmake curl wget file

      - name: Install JS deps
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      - name: Fetch libLiteRt (ai-edge-litert wheel)
        working-directory: speech-core
        run: ./scripts/fetch_litert.sh litert

      - name: Build speech-core (LiteRT + HF download)
        working-directory: speech-core
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPEECH_CORE_WITH_LITERT=ON \
            -DLITERT_DIR="$PWD/litert" \
            -DSPEECH_CORE_WITH_HF_DOWNLOAD=ON \
            -DSPEECH_CORE_BUILD_TESTS=OFF
          cmake --build build --parallel --target speech_core_models_litert

      - name: Build core-sidecar
        working-directory: speech-studio
        run: |
          cmake -B core-sidecar/build core-sidecar \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPEECH_CORE_DIR="$GITHUB_WORKSPACE/speech-core" \
            -DSPEECH_CORE_BUILD_DIR="$GITHUB_WORKSPACE/speech-core/build"
          cmake --build core-sidecar/build --parallel

      - name: Run sidecar unit tests
        working-directory: speech-studio
        run: ctest --test-dir core-sidecar/build --output-on-failure

      - name: Stage sidecar for Tauri bundler
        working-directory: speech-studio
        run: |
          mkdir -p src-tauri/binaries
          cp core-sidecar/build/speech-core-tts-sidecar \
             src-tauri/binaries/speech-core-tts-sidecar-x86_64-unknown-linux-gnu
          cp core-sidecar/build/libLiteRt.so src-tauri/binaries/libLiteRt.so

      - name: Build Tauri bundle (.deb + .AppImage)
        working-directory: speech-studio
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-linux-x86_64
          path: |
            speech-studio/src-tauri/target/release/bundle/deb/*.deb
            speech-studio/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            speech-studio/src-tauri/target/release/bundle/deb/*.deb
            speech-studio/src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: false

  # ---------------------------------------------------------------------------
  # Signed + notarized macOS release. Runs ONLY on tag pushes and is bound to
  # the `release` GitHub environment, whose required-reviewer rule pauses the
  # job until a maintainer approves — so the signing secrets (environment-
  # scoped, not repo-scoped) are never exposed to a run nobody signed off on.
  # The plain `build` job covers PRs and main pushes with an ad-hoc bundle.
  # ---------------------------------------------------------------------------
  release-macos:
    name: macOS release (signed + notarized)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    # softprops/action-gh-release writes to the Releases API.
    permissions:
      contents: write

    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      - name: Check out speech-swift (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: soniqo/speech-swift
          path: speech-swift
          ref: main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            speech-studio/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('speech-studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      - name: Build Swift sidecar
        working-directory: speech-studio/swift-sidecar
        run: swift build -c release

      - name: Stage sidecar + metallib for Tauri bundler
        env:
          SPEECH_SWIFT_RELEASE: v0.0.18
        working-directory: speech-studio
        run: |
          mkdir -p src-tauri/binaries
          cp swift-sidecar/.build/release/soniqo-tts-sidecar \
             src-tauri/binaries/soniqo-tts-sidecar-aarch64-apple-darwin
          curl -sSL --fail \
            "https://github.com/soniqo/speech-swift/releases/download/${SPEECH_SWIFT_RELEASE}/speech-macos-arm64.tar.gz" \
            -o /tmp/speech-release.tar.gz
          tar -xzf /tmp/speech-release.tar.gz -C /tmp mlx.metallib
          cp /tmp/mlx.metallib src-tauri/binaries/mlx.metallib

      # A release build is still a tested build.
      - name: Run Rust unit tests
        working-directory: speech-studio/src-tauri
        run: cargo test --lib

      - name: Run frontend tests
        working-directory: speech-studio
        run: pnpm test

      - name: Type-check
        working-directory: speech-studio
        run: pnpm tsc --noEmit

      # Missing-secret on a release tag fails LOUDLY here rather than
      # silently shipping unsigned.
      - name: Set up signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "::error::APPLE_CERTIFICATE secret is empty — cannot sign release."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$APPLE_CERTIFICATE" | base64 -d > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN_PATH" \
            -A -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          # Documented partition list per Apple TN3147; `-T codesign` at
          # import time already grants codesign access.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          # Pin an explicit login-keychain path rather than word-splitting
          # `security list-keychains` output.
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$P12_PATH"
          # Only KEYCHAIN_PATH survives to the teardown step;
          # `security delete-keychain` doesn't need the password and leaving
          # it in the job env would expose it to every later step.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build Tauri bundle (.app + .dmg, Developer ID signed)
        working-directory: speech-studio
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          cleanup_stale_dmg_mounts() {
            echo "::group::macOS disk image cleanup"
            hdiutil info || true
            while IFS= read -r device; do
              [[ -n "$device" ]] || continue
              echo "Detaching stale Speech Studio disk image: $device"
              hdiutil detach "$device" || hdiutil detach -force "$device" || true
            done < <(hdiutil info | awk '/\/Volumes\/Speech Studio/ { print $1 }' | sort -u)
            rm -f src-tauri/target/release/bundle/dmg/rw.*.dmg || true
            echo "::endgroup::"
          }

          if ! pnpm tauri build; then
            echo "::warning::Tauri macOS bundle failed once; cleaning stale disk images and retrying."
            cleanup_stale_dmg_mounts
            sleep 5
            pnpm tauri build
          fi

      # NSMicrophoneUsageDescription has to live in Info.plist for the TCC
      # mic prompt to render; Tauri 2 has no config knob for arbitrary plist
      # keys. Mutating Info.plist breaks the bundler's signature — the
      # re-sign steps below restore it.
      - name: Inject NSMicrophoneUsageDescription into Info.plist
        working-directory: speech-studio
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Speech Studio.app"
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Add :NSMicrophoneUsageDescription string 'Speech Studio uses the microphone to capture short reference clips for cloning your voice.'" \
            "$PLIST" 2>/dev/null \
          || /usr/libexec/PlistBuddy -c \
            "Set :NSMicrophoneUsageDescription 'Speech Studio uses the microphone to capture short reference clips for cloning your voice.'" \
            "$PLIST"

      # Codesign order matters: nested binaries first, then the outer .app
      # (the outer sign recomputes CodeResources from current nested sigs).
      # Tauri's bundler signs the sidecar with the APP's entitlements (mic,
      # JIT) — wrong for a Swift CLI hosting MLX — and omits --timestamp,
      # which notarization requires. This replaces both.
      - name: Re-sign sidecar with hardened runtime + sidecar entitlements
        working-directory: speech-studio
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Speech Studio.app"
          codesign --force --timestamp --options runtime \
            --entitlements src-tauri/Entitlements.sidecar.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$APP/Contents/MacOS/soniqo-tts-sidecar"
          codesign -d --verbose=2 "$APP/Contents/MacOS/soniqo-tts-sidecar" 2>&1 \
            | grep -E "flags=.*runtime" \
            || { echo "::error::sidecar missing hardened runtime"; exit 1; }
          codesign -d --verbose=2 "$APP/Contents/MacOS/soniqo-tts-sidecar" 2>&1 \
            | grep -E "Timestamp=" \
            || { echo "::error::sidecar missing secure timestamp"; exit 1; }

      - name: Re-sign .app with hardened runtime + app entitlements
        working-directory: speech-studio
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Speech Studio.app"
          codesign --force --timestamp --options runtime \
            --entitlements src-tauri/Entitlements.app.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"

      # The .dmg Tauri built embeds a STALE copy of the .app (pre re-sign).
      # Rebuild from the now-properly-signed .app.
      - name: Rebuild .dmg from re-signed .app
        working-directory: speech-studio
        run: |
          set -euo pipefail
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          APP="src-tauri/target/release/bundle/macos/Speech Studio.app"
          shopt -s nullglob
          DMGS=("$DMG_DIR"/*.dmg)
          shopt -u nullglob
          if (( ${#DMGS[@]} == 0 )); then
            echo "::error::No DMG found in $DMG_DIR"
            exit 1
          fi
          OLD_DMG="${DMGS[0]}"
          DMG_NAME="$(basename "$OLD_DMG")"
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          rm -f "$OLD_DMG"
          create_dmg() {
            hdiutil create -volname "Speech Studio" -srcfolder "$STAGE" \
              -ov -format UDZO "$DMG_DIR/$DMG_NAME"
          }
          if ! create_dmg; then
            echo "::warning::hdiutil failed once while rebuilding the signed DMG; retrying."
            rm -f "$DMG_DIR/$DMG_NAME"
            sleep 5
            create_dmg
          fi
          rm -rf "$STAGE"

      - name: Codesign .dmg
        working-directory: speech-studio
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(src-tauri/target/release/bundle/dmg/*.dmg)
          shopt -u nullglob
          if (( ${#DMGS[@]} == 0 )); then
            echo "::error::No DMG found to codesign"
            exit 1
          fi
          DMG="${DMGS[0]}"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"

      - name: Notarize and staple
        working-directory: speech-studio
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(src-tauri/target/release/bundle/dmg/*.dmg)
          shopt -u nullglob
          if (( ${#DMGS[@]} == 0 )); then
            echo "::error::No DMG found to notarize"
            exit 1
          fi
          DMG="${DMGS[0]}"
          # --wait blocks until Apple finishes scanning (~3-15 min) and
          # exits non-zero on rejection, so we never staple unverified bits.
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          # Staple the .app too so the zipped artifact verifies offline.
          xcrun stapler staple "src-tauri/target/release/bundle/macos/Speech Studio.app"

      # In-app auto-update artifact (tauri-plugin-updater). Built from the
      # FINAL notarized + stapled .app — the updater swaps the archive's
      # contents onto the installed app, so it must carry the production
      # Apple signature. The minisign signature over the tar.gz bytes is a
      # separate trust layer from Apple codesigning; the .sig content is
      # embedded into latest.json, which the app polls at
      # releases/latest/download/latest.json.
      - name: Build updater artifact + latest.json
        working-directory: speech-studio
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/release/bundle/macos"
          APP="Speech Studio.app"
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="Speech-Studio_${VERSION}_aarch64.app.tar.gz"
          # The installer strips the first path component of every entry,
          # so the .app must be the SINGLE top-level directory. AppleDouble
          # (._*) and xattr entries would break the embedded codesign seal
          # on extraction — suppress them.
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata \
            -czf "$BUNDLE_DIR/$ARCHIVE" -C "$BUNDLE_DIR" "$APP"
          pnpm tauri signer sign "$BUNDLE_DIR/$ARCHIVE"
          SIG="$(cat "$BUNDLE_DIR/$ARCHIVE.sig")"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # latest.json schema notes: `signature` is the CONTENT of the .sig
          # (a path or URL does not work); the asset URL must match the
          # uploaded name exactly. Windows/Linux platform entries are a
          # follow-up — the plugin treats a newer version with a missing
          # platform key as an error, which the frontend hook logs and
          # ignores.
          python3 - "$VERSION" "$SIG" "$PUB_DATE" "$ARCHIVE" > "$BUNDLE_DIR/latest.json" <<'EOF'
          import json, sys
          version, sig, pub_date, archive = sys.argv[1:5]
          print(json.dumps({
              "version": version,
              "notes": f"https://github.com/soniqo/speech-studio/releases/tag/v{version}",
              "pub_date": pub_date,
              "platforms": {
                  "darwin-aarch64": {
                      "signature": sig,
                      "url": f"https://github.com/soniqo/speech-studio/releases/download/v{version}/{archive}",
                  }
              },
          }, indent=2))
          EOF
          cat "$BUNDLE_DIR/latest.json"

      - name: Tear down signing keychain
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-arm64-dmg-signed
          path: speech-studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload .app (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-arm64-app-signed
          path: speech-studio/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

      - name: Attach .dmg + updater artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            speech-studio/src-tauri/target/release/bundle/dmg/*.dmg
            speech-studio/src-tauri/target/release/bundle/macos/*.app.tar.gz
            speech-studio/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            speech-studio/src-tauri/target/release/bundle/macos/latest.json
          fail_on_unmatched_files: true
