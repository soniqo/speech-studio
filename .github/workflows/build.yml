name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands. Saves Apple
# Silicon minutes which are 10x cheaper than they used to be but still cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      # The Swift sidecar's Package.swift uses a path dependency on
      # ../../speech-swift to match local-dev layout. Mirror that on CI by
      # checking the sibling repo out next to this one.
      - name: Check out speech-swift (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: soniqo/speech-swift
          path: speech-swift
          ref: main

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            speech-studio/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('speech-studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 since its 11.3+ release pulled in
          # the built-in `node:sqlite` module.
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      - name: Build Swift sidecar
        working-directory: speech-studio/swift-sidecar
        run: swift build -c release

      - name: Build speech-swift (for metallib)
        # MLX-Swift drops `mlx.metallib` into `.build/<triple>/<config>/` as a
        # side-effect, but only for some targets. Building speech-swift's
        # main `speech` CLI is the most reliable trigger — that's the same
        # binary the Homebrew formula ships, and its build emits the metallib
        # next to the executable.
        working-directory: speech-swift
        run: swift build -c release --product speech

      - name: Stage sidecar + metallib for Tauri bundler
        # Has to run before any `cargo` invocation: tauri-build verifies
        # externalBin paths in the build script, so even `cargo test --lib`
        # fails if `binaries/soniqo-tts-sidecar-aarch64-apple-darwin` is
        # missing.
        working-directory: speech-studio
        run: |
          mkdir -p src-tauri/binaries
          # externalBin convention: Tauri appends the target triple to the
          # configured name (`binaries/soniqo-tts-sidecar` → look for
          # `binaries/soniqo-tts-sidecar-aarch64-apple-darwin`).
          cp swift-sidecar/.build/release/soniqo-tts-sidecar \
             src-tauri/binaries/soniqo-tts-sidecar-aarch64-apple-darwin
          # Grab whichever metallib SwiftPM produced — sidecar tree first,
          # then sibling speech-swift checkout.
          metallib=$(find swift-sidecar/.build ../speech-swift/.build -name mlx.metallib -type f 2>/dev/null | head -1)
          if [ -z "$metallib" ]; then
            echo "::error::mlx.metallib not found in any build tree"
            find swift-sidecar/.build ../speech-swift/.build -type d 2>/dev/null | head -60
            exit 1
          fi
          echo "Using metallib at: $metallib"
          cp "$metallib" src-tauri/binaries/mlx.metallib
          ls -la src-tauri/binaries/

      - name: Run Rust unit tests
        working-directory: speech-studio/src-tauri
        run: cargo test --lib

      - name: Run frontend tests
        working-directory: speech-studio
        run: pnpm test

      - name: Type-check
        working-directory: speech-studio
        run: pnpm tsc --noEmit

      - name: Build Tauri bundle (.app + .dmg, unsigned)
        working-directory: speech-studio
        # No --no-bundle: we want the .app + .dmg. The macOS bundler
        # ad-hoc signs without a Developer ID; users will need to right-
        # click → Open the first time to bypass Gatekeeper.
        run: pnpm tauri build

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-arm64-dmg
          path: speech-studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .app (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-arm64-app
          path: speech-studio/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14

      # Attach the .dmg to a GitHub Release when a tag like `v0.1.0` is
      # pushed. Manual `git push origin v0.1.0` triggers this.
      - name: Attach .dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: speech-studio/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
