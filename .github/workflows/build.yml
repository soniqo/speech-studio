name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands. Saves Apple
# Silicon minutes which are 10x cheaper than they used to be but still cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    # softprops/action-gh-release needs to write to the Releases API on tag
    # pushes; the default GITHUB_TOKEN is read-only without this block.
    permissions:
      contents: write

    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      # The Swift sidecar's Package.swift uses a path dependency on
      # ../../speech-swift to match local-dev layout. Mirror that on CI by
      # checking the sibling repo out next to this one.
      - name: Check out speech-swift (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: soniqo/speech-swift
          path: speech-swift
          ref: main

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            speech-studio/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('speech-studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 since its 11.3+ release pulled in
          # the built-in `node:sqlite` module.
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      - name: Build Swift sidecar
        working-directory: speech-studio/swift-sidecar
        run: swift build -c release

      - name: Stage sidecar + metallib for Tauri bundler
        # Has to run before any `cargo` invocation: tauri-build verifies
        # externalBin paths in the build script, so even `cargo test --lib`
        # fails if `binaries/soniqo-tts-sidecar-aarch64-apple-darwin` is
        # missing.
        env:
          # Pin the speech-swift release we pull the metallib from. The
          # metallib is precompiled Metal bytecode and rarely changes; bump
          # this when MLX-Swift's metal kernels do.
          SPEECH_SWIFT_RELEASE: v0.0.18
        working-directory: speech-studio
        run: |
          mkdir -p src-tauri/binaries
          # externalBin convention: Tauri appends the target triple to the
          # configured name (`binaries/soniqo-tts-sidecar` → look for
          # `binaries/soniqo-tts-sidecar-aarch64-apple-darwin`).
          cp swift-sidecar/.build/release/soniqo-tts-sidecar \
             src-tauri/binaries/soniqo-tts-sidecar-aarch64-apple-darwin
          # MLX-Swift drops `mlx.metallib` into the build tree as a side
          # effect, but on this CI runner that side effect never fires
          # (Metal toolchain quirks). Pull a known-good metallib from the
          # speech-swift release tarball instead — same artifact Homebrew
          # ships for `speech`.
          curl -sSL --fail \
            "https://github.com/soniqo/speech-swift/releases/download/${SPEECH_SWIFT_RELEASE}/speech-macos-arm64.tar.gz" \
            -o /tmp/speech-release.tar.gz
          tar -xzf /tmp/speech-release.tar.gz -C /tmp mlx.metallib
          cp /tmp/mlx.metallib src-tauri/binaries/mlx.metallib
          ls -la src-tauri/binaries/

      - name: Run Rust unit tests
        working-directory: speech-studio/src-tauri
        run: cargo test --lib

      - name: Run frontend tests
        working-directory: speech-studio
        run: pnpm test

      - name: Type-check
        working-directory: speech-studio
        run: pnpm tsc --noEmit

      - name: Build Tauri bundle (.app + .dmg, unsigned)
        working-directory: speech-studio
        # No --no-bundle: we want the .app + .dmg. The macOS bundler
        # ad-hoc signs without a Developer ID; users will need to right-
        # click → Open the first time to bypass Gatekeeper.
        run: pnpm tauri build

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-arm64-dmg
          path: speech-studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .app (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-macos-arm64-app
          path: speech-studio/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14

      # Attach the .dmg to a GitHub Release when a tag like `v0.1.0` is
      # pushed. Manual `git push origin v0.1.0` triggers this. We typically
      # pre-create the release with `gh release create` (so we control the
      # body); this step just uploads the CI-built artifact alongside.
      - name: Attach .dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: speech-studio/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Linux / Windows: no MLX sidecar — the synthesis backend links speech-core's
  # LiteRT engine over the sc_voxcpm2_* C ABI (src-tauri/build.rs). These lanes
  # validate that the FFI + cmake link compiles. The ~4 GB model bundle is
  # runtime-only (downloaded on first synth), so it isn't needed to build.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      - name: Check out speech-core (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: soniqo/speech-core
          path: speech-core
          ref: main

      - name: Install system deps (Tauri + build toolchain + cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            build-essential cmake curl ca-certificates python3 python3-pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            speech-studio/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('speech-studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      - name: Fetch libLiteRt runtime
        working-directory: speech-core
        run: ./scripts/fetch_litert.sh "$PWD/litert"

      - name: Build Tauri shell (no bundle)
        working-directory: speech-studio
        env:
          SPEECH_CORE_DIR: ${{ github.workspace }}/speech-core
          LITERT_DIR: ${{ github.workspace }}/speech-core/litert
        run: pnpm tauri build --no-bundle

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      - name: Check out speech-core (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: soniqo/speech-core
          path: speech-core
          ref: main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Puts MSVC's cl/lib/dumpbin on PATH — needed both to compile speech-core
      # and for fetch_litert.sh to generate libLiteRt.lib from the DLL.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            speech-studio/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('speech-studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      - name: Fetch libLiteRt runtime
        working-directory: speech-core
        shell: bash
        env:
          PYTHON: python
        run: ./scripts/fetch_litert.sh "$PWD/litert"

      - name: Build Tauri shell (no bundle)
        working-directory: speech-studio
        env:
          SPEECH_CORE_DIR: ${{ github.workspace }}\speech-core
          LITERT_DIR: ${{ github.workspace }}\speech-core\litert
        run: pnpm tauri build --no-bundle
